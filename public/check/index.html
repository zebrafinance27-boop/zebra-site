<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script>
"use strict";
/* =====================================================================
   CONFIG — public values only. Never put API keys / webhook URLs here.
   The Make webhook URL, its secret and the Meta CAPI token live in
   Netlify environment variables and are used only by
   netlify/functions/submit-lead.mjs and netlify/functions/track.mjs.
   ===================================================================== */
const CONFIG = {
  apiBase: "/api",                 // → /.netlify/functions/* (see public/_redirects)
  phone: "0545995519",
  whatsapp: "972545995519",
  privacyUrl: "/privacy/",
  accessibilityUrl: "/accessibility/",
  metaPixelId: "3921297834677512", // Zebra-owned Pixel — same as src/layouts/Base.astro (public ID, safe in the browser)
  minYear: 2011,
  value: { min: 10000, max: 500000, step: 1000, initial: 50000 },
  amount: { min: 5000, max: 500000, step: 1000 },
  storageKey: "zb_check_v1",
  // Every step gets its own URL so Meta can build audiences / custom conversions by URL:
  //   /check/ → /check/year → /check/value → /check/lien → /check/amount → /check/details → /check/offer
  // "path" needs the rewrite in public/_redirects. "hash" (#year…) for hosts without rewrites. "none" keeps one URL.
  urlMode: "path",
  basePath: "/check/",
  storageTtlMs: 7 * 24 * 3600 * 1000,
  // results screen: show the annual rate the simulation assumes (in "איך חישבנו?"). false hides it.
  showAssumedRate: true,
};

/* DEMO MODE: on localhost / file:// or with ?demo=1 nothing leaves the browser.
   ?live=1 forces live mode (for testing a deployed preview). */
const QS = new URLSearchParams(location.search);
const DEMO = !QS.has("live") && (location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || QS.has("demo"));

const { useState, useEffect, useRef, useMemo, useCallback } = React;
const html = htm.bind(React.createElement);

/* ---------------- utils ---------------- */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nf = new Intl.NumberFormat("he-IL");
const fmt = (n) => nf.format(Math.round(n || 0));
const ILS = (n) => html`<span dir="ltr" className="num">₪${fmt(n)}</span>`;
const digits = (s) => String(s || "").replace(/\D/g, "");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const roundTo = (v, s) => Math.round(v / s) * s;
// slider uses a quadratic scale so the common 20k–200k range gets most of the track
const toPos = (v, min, max) => Math.round(Math.sqrt(clamp((v - min) / (max - min), 0, 1)) * 1000);
const fromPos = (p, min, max, step) => clamp(roundTo(min + (max - min) * Math.pow(p / 1000, 2), step), min, max);
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
};
const getCookie = (n) => { const m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; };

/* ---------------- attribution (captured once per session, survives step navigation) ---------------- */
const ATTR = (() => {
  const keys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid"];
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem("zb_attr")); } catch (e) {}
  const fresh = {}; keys.forEach((k) => { const v = QS.get(k); if (v) fresh[k] = v.slice(0, 300); });
  const a = Object.assign({}, saved || {}, fresh);
  if (!a.landing_page) a.landing_page = location.origin + location.pathname;
  if (!a.referrer) a.referrer = document.referrer || "";
  if (!a.fbclid_ts && a.fbclid) a.fbclid_ts = Date.now();
  ss.set("zb_attr", JSON.stringify(a));
  return a;
})();
/* ---------------- step URLs ---------------- */
const SLUGS = { 0: "", 1: "year", 2: "value", 3: "lien", 4: "amount", 5: "details", results: "offer" };
// keeps the query string (utm_*, fbclid) on every step URL
function urlFor(key) {
  const slug = SLUGS[key] ?? "";
  if (CONFIG.urlMode === "path") return CONFIG.basePath + slug + location.search;
  if (CONFIG.urlMode === "hash") return location.pathname + location.search + (slug ? "#" + slug : "");
  return undefined;
}

const fbc = () => getCookie("_fbc") || (ATTR.fbclid ? `fb.1.${ATTR.fbclid_ts}.${ATTR.fbclid}` : "");

/* ---------------- Meta Pixel + CAPI (deduplicated by event_id) ----------------
   Only event names + non-financial context are sent to Meta.
   No amounts, lien status, balances or loan purpose are ever included. */
const Track = {
  log: [],
  init() {
    if (DEMO || !CONFIG.metaPixelId) return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    window.fbq.disablePushState = true;   // we send one PageView per step ourselves (with event_id for CAPI dedup)
    window.fbq("init", CONFIG.metaPixelId);
  },
  // fires Pixel (browser) + mirrors to CAPI (server) with the same event_id
  fire(name, { custom = false, eventId = uuid(), server = true } = {}) {
    const params = { content_name: "car_equity_check" };
    this.log.push({ name, eventId, at: new Date().toISOString() });
    if (DEMO) { console.info("%c[demo] Meta event", "color:#5FA833", name, { eventId, params }); return eventId; }
    if (window.fbq) window.fbq(custom ? "trackCustom" : "track", name, params, { eventID: eventId });
    if (server) {
      const body = JSON.stringify({ event_name: name, event_id: eventId, event_source_url: location.href, fbp: getCookie("_fbp"), fbc: fbc() });
      try {
        const ok = navigator.sendBeacon && navigator.sendBeacon(CONFIG.apiBase + "/track", new Blob([body], { type: "application/json" }));
        if (!ok) fetch(CONFIG.apiBase + "/track", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {});
      } catch (e) {}
    }
    return eventId;
  },
  // once per browser session, so back/forward never double-counts a funnel step
  once(name, opts) { const k = "zb_ev_" + name; if (ss.get(k)) return null; ss.set(k, "1"); return this.fire(name, opts); },
};

/* ---------------- domain ---------------- */
const NOW_YEAR = new Date().getFullYear();
/* Max number of monthly payments by vehicle year (Zebra's table). Keep in sync with netlify/functions/submit-lead.mjs */
const TERM_BY_YEAR = { 2011: 12, 2012: 24, 2013: 24, 2014: 36, 2015: 36, 2016: 36, 2017: 48, 2018: 48, 2019: 60, 2020: 60, 2021: 72, 2022: 84 };
const maxTerm = (year) => (year >= 2023 ? 100 : TERM_BY_YEAR[year] || null);
/* Example loan routes (simulation only — not lender offers). Annuity ("Spitzer") payment at an assumed annual rate.
   Up to 3 routes: low monthly = max term for the car year · balanced · short.
   e.g. max 100 → 100/60/36, 60 → 60/48/36, 48 → 48/36/24, 24 → 24/12. Keep in sync with submit-lead.mjs */
const ROUTE_RATE = 0.095;
const monthlyPayment = (principal, n) => { const r = ROUTE_RATE / 12; return (principal * r) / (1 - Math.pow(1 + r, -n)); };
const STD_TERMS = [84, 72, 60, 48, 36, 24, 12];
function routeTerms(max) {
  if (!max) return [];
  const lower = STD_TERMS.filter((t) => t < max);
  const bal = max > 60 ? 60 : lower[0];
  const sh = bal > 36 ? 36 : lower.filter((t) => t < bal)[0];
  return [max, bal, sh].filter(Boolean);
}
const TERM_STEPS = [12, 24, 36, 48, 60, 72, 84, 100];   // simulator slider stops (capped by the car's max term)
const quote = (amount, n) => { const monthly = Math.round(monthlyPayment(amount, n)); const total = monthly * n; return { monthly, total, cost: Math.max(0, total - amount) }; };
const loanRoutes = (amount, max) => (!amount || !max ? [] : routeTerms(max).map((term) => ({ term, monthly: Math.round(monthlyPayment(amount, term)) })));
const YEARS = Array.from({ length: NOW_YEAR - CONFIG.minYear + 1 }, (_, i) => NOW_YEAR - i);
const LIEN = {
  free: "הרכב בבעלותי וללא שעבוד",
  loan: "קיימת הלוואה או שעבוד על הרכב",
  unsure: "לא בטוח/ה",
};
const STEPS = [
  null,
  { label: "שנת הרכב", hint: "שאלה קצרה אחת בכל מסך" },
  { label: "שווי הרכב" },
  { label: "מצב השעבוד" },
  { label: "סכום המימון" },
  { label: "פרטים אחרונים" },
];
const TOTAL = 5;

function computeEquity(s) {
  const v = s.value;
  if (s.lien === "free") return { equity: v, basis: "no_lien" };
  if (s.lien === "unsure") return { equity: v, basis: "assumes_no_lien" };
  if (s.lien === "loan") {
    if (s.balanceUnknown || s.balance === "" || s.balance == null) return { equity: null, basis: "balance_unknown" };
    return { equity: Math.max(0, v - Number(s.balance)), basis: "value_minus_balance" };
  }
  return { equity: null, basis: "incomplete" };
}

function normalizePhone(raw) {
  let d = digits(raw);
  if (d.startsWith("972")) d = "0" + d.slice(3);
  return d;
}
function phoneError(raw) {
  const d = normalizePhone(raw);
  if (!d) return "נא להזין מספר טלפון נייד";
  if (!/^05\d{8}$/.test(d)) return "נא להזין מספר נייד ישראלי תקין (10 ספרות, מתחיל ב-05)";
  return "";
}
function nameError(raw) {
  const v = String(raw || "").trim();
  if (!v) return "נא להזין שם מלא";
  if (v.length < 2 || !/[֐-׿a-zA-Z]/.test(v)) return "נא להזין שם תקין";
  return "";
}
/* Email typo detection — keep in sync with netlify/functions/submit-lead.mjs.
   Catches truncated / misspelled popular providers (gm.com, gmial.com, gmail.co, walla.co, hotmial.com…). */
const MAIL_PROVIDERS = { gmail: "gmail.com", walla: "walla.co.il", hotmail: "hotmail.com", yahoo: "yahoo.com", outlook: "outlook.com", icloud: "icloud.com" };
const MAIL_VALID = new Set(["gmail.com", "googlemail.com", "walla.co.il", "walla.com", "hotmail.com", "hotmail.co.il", "yahoo.com", "yahoo.co.il",
  "outlook.com", "outlook.co.il", "icloud.com", "me.com", "live.com", "msn.com", "mail.com", "gmx.com", "aol.com", "protonmail.com", "proton.me",
  "netvision.net.il", "bezeqint.net", "012.net.il", "zahav.net.il", "inter.net.il", "smile.net.il", "hot.net.il", "013net.net"]);
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
  {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); // swapped letters
  }
  return d[a.length][b.length];
}
function emailSuggestion(raw) {
  const v = String(raw || "").trim().toLowerCase();
  const at = v.lastIndexOf("@");
  if (at < 1) return null;
  const local = v.slice(0, at), domain = v.slice(at + 1);
  if (!domain || MAIL_VALID.has(domain)) return null;
  const name = domain.split(".")[0];
  for (const [p, canonical] of Object.entries(MAIL_PROVIDERS)) {
    const close = name === p || (name.length >= 2 && p.startsWith(name)) || (name.length >= 4 && lev(name, p) <= 1);
    if (close) return local + "@" + canonical;
  }
  return null;
}
function emailError(raw) {
  const v = String(raw || "").trim();
  if (!v) return "נא להזין כתובת מייל";
  if (emailSuggestion(v)) return "נראה שיש טעות בכתובת המייל";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "נא להזין כתובת מייל תקינה, למשל name@gmail.com";
  return "";
}

const INITIAL = () => ({
  step: 0,
  year: null,
  value: CONFIG.value.initial,
  lien: null,               // free | loan | unsure
  balance: "",
  balanceUnknown: false,
  amount: null,
  name: "",
  email: "",
  phone: "",
  consent: false,
  company: "",              // honeypot
  leadId: uuid(),
  result: null,             // { ref, submittedAt, payload }
});

function loadState() {
  const saved = ls.get(CONFIG.storageKey);
  if (!saved || !saved.ts || Date.now() - saved.ts > CONFIG.storageTtlMs) return INITIAL();
  const st = Object.assign(INITIAL(), saved.s);
  if (st.step > TOTAL) st.step = TOTAL;                                   // state saved by an older funnel version
  if (typeof st.year !== "number" || st.year < CONFIG.minYear) st.year = null;
  if (!(st.value >= CONFIG.value.min)) st.value = CONFIG.value.initial;
  return st;
}

/* ---------------- icons (stroke, 24 grid) ---------------- */
const P = {
  percent: html`<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>`,
  car: html`<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>`,
  shield: html`<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>`,
  check: html`<path d="M20 6 9 17l-5-5"/>`,

/* Scroll an element to just under the sticky header, so it stays visible above the phone keyboard.
   Runs twice because the keyboard opens at different speeds on different phones. */
function revealUnderHeader(el) {
  if (!el) return;
  const go = () => {
    const header = document.querySelector("header");
    const top = el.getBoundingClientRect().top + window.scrollY - ((header && header.offsetHeight) || 0) - 12;
    window.scrollTo(0, Math.max(0, top));   // instant: "smooth" is unreliable while a phone keyboard is opening
  };
  setTimeout(go, 120);
  setTimeout(go, 480);
}

      placeholder=${placeholder} value=${value === "" || value == null ? "" : fmt(value)}
      onFocus=${(e) => { if (window.matchMedia("(pointer: coarse)").matches) revealUnderHeader(revealTarget ? document.getElementById(revealTarget) : e.target.closest("div")); }}
      onKeyDown=${(e) => { if (e.key === "Enter" && onEnter) onEnter(); }}

function StepAmount({ s, set, next }) {
  const { min, step } = CONFIG.amount;
  const max = Math.max(min, Number(s.value) || min);   // never more than the car value entered
  const { equity, basis } = computeEquity(s);
  const amount = s.amount;
  const [capped, setCapped] = useState(false);
  useEffect(() => {
    if (s.amount == null) {
      const base = equity != null && equity > 0 ? roundTo(equity * 0.6, step) : roundTo(max * 0.5, step);
      set({ amount: clamp(base, min, max) });
    } else if (s.amount > max) set({ amount: max });   // car value was lowered after going back
  }, []);
  const [bump, setBump] = useState(0);
  const change = (v) => { setCapped(false); set({ amount: v }); setBump((b) => b + 1); };
  const typed = (v) => {
    if (v !== "" && v > max) { setCapped(true); set({ amount: max }); }
    else { setCapped(false); set({ amount: v }); }
  };
  const within = equity != null && amount != null && amount <= equity;
  const ratio = equity ? clamp((amount || 0) / equity, 0, 1.4) : 0;

const REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
// animates a number from its previous value to `target` (from 0 the first time, after `delay` ms)
function useTween(target, ms = 650, delay = 0) {
  const [v, setV] = useState(REDUCED ? target : 0);
  const cur = useRef(REDUCED ? target : 0);
  const first = useRef(true);
  useEffect(() => {
    if (REDUCED) { cur.current = target; setV(target); return; }
    const a = cur.current, b = target, wait = first.current ? delay : 0;
    first.current = false;
    let raf, t0 = null;
    const tick = (t) => {
      if (t0 == null) t0 = t;
      const k = clamp((t - t0 - wait) / ms, 0, 1);
      const x = a + (b - a) * (1 - Math.pow(1 - k, 3));
      cur.current = x; setV(x);
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return v;
}
function Count({ value, ms, delay, className = "" }) {
  const v = useTween(value, ms, delay);
  return html`<${Fig} n=${v} className=${className} />`;
}

/* ---------------- submission ---------------- */
function buildPayload(s, eventId) {
  const { equity, basis } = computeEquity(s);
  const balance = s.lien === "loan" && !s.balanceUnknown && s.balance !== "" ? Number(s.balance) : null;
  return {
    lead_id: s.leadId,
    full_name: s.name.trim(),
    email: s.email.trim().toLowerCase(),
    phone: normalizePhone(s.phone),
    vehicle_year: String(s.year),
    vehicle_value: Number(s.value),
    lien_status: s.lien,
    lien_status_label: LIEN[s.lien],
    existing_loan_balance: balance,
    balance_unknown: s.lien === "loan" ? !!s.balanceUnknown || s.balance === "" : false,
    requested_amount: Number(s.amount),
    estimated_equity: equity,
    financing_option_estimate: equity != null ? Math.min(Number(s.amount), equity) : Number(s.amount),
    max_term_months: maxTerm(s.year),
    loan_routes: loanRoutes(Number(s.amount), maxTerm(s.year)),
    estimate_basis: basis,
    submitted_at: new Date().toISOString(),
    consent: !!s.consent,
    consent_text: "אישור העברת פרטים לצורך בדיקת הבקשה ויצירת קשר, בהתאם למדיניות הפרטיות",
    utm_source: ATTR.utm_source || "",
    utm_medium: ATTR.utm_medium || "",
    utm_campaign: ATTR.utm_campaign || "",
    utm_content: ATTR.utm_content || "",
    utm_term: ATTR.utm_term || "",
    fbclid: ATTR.fbclid || "",
    landing_page: ATTR.landing_page,
    referrer: ATTR.referrer,
    // for Meta CAPI dedup — used server-side only, not forwarded as financial data
    meta: { event_id: eventId, fbp: getCookie("_fbp"), fbc: fbc(), event_source_url: location.href },
    company: s.company, // honeypot
  };
}

async function sendLead(payload) {
  if (DEMO) {
    await sleep(700);
    console.info("%c[demo] Lead payload (not sent)", "color:#5FA833;font-weight:bold", payload);
    return { ok: true, ref: "DEMO-" + payload.lead_id.replace(/[^a-z0-9]/gi, "").slice(0, 6).toUpperCase() };
  }
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(CONFIG.apiBase + "/submit-lead", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: ctrl.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || "HTTP " + res.status);
    return data;
  } finally { clearTimeout(t); }
}

/* ---------------- app shell ---------------- */
function App() {
  const [s, setS] = useState(loadState);
  const [dir, setDir] = useState("fwd");
  const [submitting, setSubmitting] = useState(false);
  const [proc, setProc] = useState(null); // { done, error }
  const [resumable, setResumable] = useState(() => { const x = loadState(); return !x.result && x.step > 0 && x.step <= TOTAL ? x.step : 0; });
  const inflight = useRef(false);
  const topRef = useRef(null);

  const set = useCallback((patch) => setS((p) => Object.assign({}, p, patch)), []);

  // persist everything (except honeypot) so refresh / back never loses data
  useEffect(() => { const { company, ...rest } = s; ls.set(CONFIG.storageKey, { ts: Date.now(), s: rest }); }, [s]);

  // pixel init; PageView is sent once per screen (each screen has its own URL)
  useEffect(() => { Track.init(); }, []);
  const screenKey = s.result ? "results" : s.step;
  useEffect(() => { Track.fire("PageView"); }, [screenKey]);

  // browser/phone back button walks the funnel instead of leaving the page
  useEffect(() => {
    const startStep = s.result ? "results" : s.step;
    history.replaceState({ zb: startStep }, "", urlFor(startStep));
    const onPop = (e) => {
      setS((p) => {
        if (p.result) { history.pushState({ zb: "results" }, "", urlFor("results")); return p; }
        const to = e.state && typeof e.state.zb === "number" ? e.state.zb : 0;
        setDir(to < p.step ? "back" : "fwd");
        return Object.assign({}, p, { step: to });
      });
    };
    addEventListener("popstate", onPop);
    return () => removeEventListener("popstate", onPop);
  }, []);

  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); }, [s.step, !!s.result, !!proc]);

  const go = (n) => { setDir("fwd"); history.pushState({ zb: n }, "", urlFor(n)); set({ step: n }); };
  const next = () => {
    const cur = s.step;
    if (cur === 2) Track.once("VehicleDetailsCompleted", { custom: true });
    if (cur === 4) Track.once("FinancingDetailsCompleted", { custom: true });
    go(cur + 1);
  };
  const back = () => history.back();

  const start = (fresh) => {
    if (fresh) { const n = INITIAL(); setS(n); setResumable(0); }
    Track.once("StartApplication", { custom: true });
    setDir("fwd"); history.pushState({ zb: 1 }, "", urlFor(1)); set({ step: 1 });
  };
  const resume = () => { Track.once("StartApplication", { custom: true }); go(resumable); };

  const submit = async () => {
    if (inflight.current) return;           // double-submit guard
    inflight.current = true; setSubmitting(true);
    const leadEventId = "lead-" + s.leadId;  // deterministic → Pixel & CAPI dedupe, even on retry
    const payload = buildPayload(s, leadEventId);
    setProc({ done: 0, error: false });
    // the first three steps are computed in the browser; the last one waits for the server to store the lead
    const anim = (async () => { for (let i = 1; i <= 3; i++) { await sleep(i === 1 ? 700 : 750); setProc((p) => p && { ...p, done: Math.max(p.done, i) }); } })();
    try {
      const [res] = await Promise.all([sendLead(payload), anim]);
      setProc({ done: TASKS.length, error: false });
      // Lead fires ONLY after the server confirmed the request was stored
      if (!ss.get("zb_lead_" + s.leadId)) { ss.set("zb_lead_" + s.leadId, "1"); Track.fire("Lead", { eventId: leadEventId, server: false /* CAPI Lead is sent by submit-lead */ }); }
      await sleep(650);
      const { meta, company, ...clean } = payload;
      history.replaceState({ zb: "results" }, "", urlFor("results"));
      set({ result: { ref: res.ref || s.leadId.slice(0, 8).toUpperCase(), submittedAt: payload.submitted_at, payload: clean } });
      setProc(null);
    } catch (e) {
      console.error("submit failed", e);
      await anim;
      setProc({ done: TASKS.length - 1, error: true });
    } finally {
      inflight.current = false; setSubmitting(false);
    }
  };

  const restart = () => { ls.del(CONFIG.storageKey); setProc(null); setResumable(0); setS(INITIAL()); setDir("back"); history.replaceState({ zb: 0 }, "", urlFor(0)); };

  const waFallback = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("היי זברה, התחלתי בדיקת מימון כנגד רכב ואשמח להמשיך איתכם.")}`;

  // ---- render
  const inFunnel = !s.result && !proc && s.step >= 1 && s.step <= TOTAL;
  const pct = inFunnel ? Math.round(((s.step - 1) / TOTAL) * 100 + 100 / TOTAL / 2) : proc ? 100 : 0;
  const remaining = inFunnel ? Math.max(5, (TOTAL - s.step + 1) * 8) : 0;

  let body;
  if (s.result) body = html`<${Results} s=${s} onRestart=${restart} />`;
  else if (proc) body = html`<${Processing} s=${s} done=${proc.done} error=${proc.error} onRetry=${submit} waLink=${waFallback} />`;
  else if (s.step === 0) body = html`<${Welcome} onStart=${() => start(true)} resume=${resumable} onResume=${resume} />`;
  else {
    const props = { s, set, next };
    body = [null,
      html`<${StepYear} ...${props} />`,
      html`<${StepValue} ...${props} />`,
      html`<${StepLien} ...${props} />`,
      html`<${StepAmount} ...${props} />`,
      html`<${StepDetails} s=${s} set=${set} submit=${submit} submitting=${submitting} />`,
    ][s.step];
  }

  const wide = !!s.result;   // results use the full desktop width; funnel screens get a side rail on desktop

  return html`<div className="min-h-[100dvh] flex flex-col" ref=${topRef}>
    <${DemoBar} />
    <header className="sticky top-0 z-20 bg-white/90 backdrop-blur-md">
      <div className="max-w-[480px] lg:max-w-[1080px] mx-auto px-4 h-[60px] flex items-center justify-between">
        <div className="w-20">
          ${inFunnel && html`<button type="button" onClick=${back} aria-label="חזרה לשלב הקודם"
            className="h-10 pl-3 pr-1.5 -mr-1.5 rounded-xl flex items-center gap-0.5 text-[14px] font-semibold text-ink-700 hover:bg-paper active:scale-95 transition">
            <${Icon} n="chevR" className="w-5 h-5" />חזרה</button>`}
        </div>
        <${Logo} size=${s.step === 0 && !s.result && !proc ? "lg" : "md"} />
        <div className="w-20 text-left">
          ${inFunnel && html`<span className="text-[12.5px] font-bold text-ink-500 num">${s.step}<span className="text-[#b5bab3]">/${TOTAL}</span></span>`}
        </div>
      </div>
      ${inFunnel && html`<div className="max-w-[480px] lg:max-w-[1080px] mx-auto px-4 pb-3"><div className="lg:max-w-[480px]">
        <div className="flex gap-1.5" role="progressbar" aria-valuemin="0" aria-valuemax=${TOTAL} aria-valuenow=${s.step} aria-label=${"שלב " + s.step + " מתוך " + TOTAL}>
          ${Array.from({ length: TOTAL }, (_, i) => html`<div key=${i} className="h-1.5 flex-1 rounded-full bg-line overflow-hidden">
            <div className="h-full bg-brand rounded-full transition-all duration-500 ease-out" style=${{ width: i < s.step - 1 ? "100%" : i === s.step - 1 ? "55%" : "0%" }}></div>
          </div>`)}
        </div>
        <div className="flex justify-between mt-2 text-[12px]">
          <span className="font-bold text-ink-700">${STEPS[s.step].label}</span>
          <span className="text-ink-500 flex items-center gap-1"><${Icon} n="clock" className="w-3.5 h-3.5" />עוד כ-${remaining} שניות</span>
        </div>
      </div></div>`}
      <div className="h-px bg-line"></div>
    </header>

    <main className="flex-1 w-full max-w-[480px] lg:max-w-[1080px] mx-auto px-4 pt-6 lg:pt-10 safe-b">
      <div className=${wide ? "" : "lg:grid lg:grid-cols-[480px_minmax(0,1fr)] lg:gap-16 lg:items-start"}>
        <div key=${(s.result ? "r" : proc ? "p" : s.step)} className=${(dir === "back" ? "anim-back" : "anim-fwd") + " min-w-0"}>${body}</div>
        ${!wide && html`<${SideRail} step=${proc ? TOTAL + 1 : s.step} />`}
      </div>
      <div className=${wide ? "" : "lg:max-w-[480px]"}><${Disclosure} /></div>
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
